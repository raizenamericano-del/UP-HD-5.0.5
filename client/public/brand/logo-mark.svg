<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ALL VD HD — app icon (by [Rifky]) · gradien violet→cyan, play + status ring -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="url(#shine)"/>
  <!-- status ring (busur 300°) -->
  <path d="M 256 118 A 138 138 0 1 1 121.4 293.6"
        fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="30" stroke-linecap="round"/>
  <!-- play button -->
  <path d="M 222 190 L 330 256 L 222 322 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
</svg>
