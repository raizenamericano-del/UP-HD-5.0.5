    <title>ALL VD HD — Upload HD Anti Pecah</title>
    <style>
      html, body { background: #06060f; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #06060f; z-index: 99; }
      #boot .b { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, #8b5cf6, #6366f1 55%, #22d3ee); animation: bp 1.1s ease-in-out infinite; }
      @keyframes bp { 0%,100% { transform: scale(0.86); opacity: 0.6 } 50% { transform: scale(1); opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="b"></div></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // hilangkan boot placeholder begitu React mount
      new MutationObserver(function (m, obs) {
        if (document.querySelector('#root')?.children.length) {
          document.getElementById('boot')?.remove();
          obs.disconnect();
        }
      }).observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
